name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the release is cut from the default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must be cut from $DEFAULT_BRANCH, got $REF_NAME"
            exit 1
          fi

      - name: Check the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # A release is the worst moment to discover the suite is red.
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest

      - name: Set the manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/set_manifest_version.py "$VERSION"

      - name: Commit the version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git diff --quiet; then
            echo "manifest.json is already at $VERSION, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # The tag has to come after the bump: HACS reads manifest.json from the
      # repository tree at the tag, so the tag must contain the new version.
      - name: Tag and publish the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes
